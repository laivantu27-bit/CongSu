[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-ai-assistant"
version = "0.1.0"
description = "A local-first Vietnamese desktop AI assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "sounddevice>=0.5",
]
tts = [
    "numpy>=1.26",
    "piper-tts>=1.3",
    "sounddevice>=0.5",
]
desktop = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
]
browser = [
    "playwright>=1.50",
]
mcp = [
    "mcp>=1.9,<2",
]
test = []

[project.scripts]
desktop-assistant = "assistant_desktop.app:main"
assistant-mcp = "assistant_desktop.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
